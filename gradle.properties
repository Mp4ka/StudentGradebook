# Общие настройки Gradle для проекта StudentGradebook.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Проект использует AndroidX (обязательно для современных библиотек).
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP добавляет сгенерированные исходники через kotlin.sourceSets,
# это отключение разрешает такую интеграцию при встроенной поддержке Kotlin в AGP.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
